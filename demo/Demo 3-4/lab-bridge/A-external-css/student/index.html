<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <title>
            Workshop Course Links
        </title>
        <style>
            body { max-width: 800px; margin: 30px auto; padding: 20px; font-family: Arial, sans-serif; line-height: 1.5; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px; border: 1px solid #748c98; text-align: left; }
a:focus { outline: 3px solid #a34b00; }
        </style>
    </head>
    <body>
        <h1>
            Workshop Course Links
        </h1>
        <p>
            Build repository links for two public example folders. These are example repository folders, not hosted lab websites.
        </p>
        <table>
            <thead>
                <tr>
                    <th scope="col">
                        Example folder
                    </th>
                    <th scope="col">
                        Repository link
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>
                        lab1-4
                    </td>
                    <td>
                        <span class="repo-link" data-repo-folder="lab1-4" id="repo-link">
                            Link appears here.
                        </span>
                    </td>
                </tr>
                <tr>
                    <td>
                        lab2-1
                    </td>
                    <td>
                        <span class="repo-link" data-repo-folder="lab2-1">
                            Link appears here.
                        </span>
                    </td>
                </tr>
            </tbody>
        </table>
        <p>Practice building links to the corresponding repository folders.</p>
    </body>
</html>
