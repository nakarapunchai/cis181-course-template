<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650"><rect width="1200" height="650" fill="white"/><g font-family="Arial" fill="#164b63"><text x="40" y="60" font-size="32" font-weight="bold">Lab 3-3 bridge — one step at a time</text><text x="40" y="125" font-size="23">1. Supplied sample values → one generated link</text><text x="40" y="185" font-size="23">2. Same values + two placeholders → repeat with a for loop</text><text x="40" y="245" font-size="23">3. Same loop + published address → actual course repository links</text></g><g font-family="Menlo,Consolas,monospace" font-size="23" fill="#24323c"><text x="40" y="330">studentname.github.io / cis181_sample_j / lab3-3 /</text><text x="40" y="380">hostname → owner</text><text x="370" y="380">repository</text><text x="620" y="380">lab folder</text><text x="40" y="455">hostname → remove .github.io → owner</text><text x="40" y="505">pathname → split('/') → index 1 → repository</text></g><text x="40" y="595" font-family="Arial" font-size="20" fill="#a34b00">Read one placeholder, create one anchor, then repeat that same operation.</text></svg>