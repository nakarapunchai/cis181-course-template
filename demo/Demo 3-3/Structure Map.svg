<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="998" viewBox="0 0 1300 998"><rect width="100%" height="100%" fill="white"/><text x="35" y="48" font-family="Arial" font-size="30" font-weight="bold" fill="#164b63">Demo 3-3 — JavaScript Basics</text><text x="35" y="83" font-family="Arial" font-size="18" fill="#405967">Campus Workshops • selected completed-page relationships</text><text x="35" y="135" font-family="Menlo,Consolas,monospace" font-size="20" fill="#164b63" xml:space="preserve">body</text><text x="35" y="169" font-family="Menlo,Consolas,monospace" font-size="20" fill="#164b63" xml:space="preserve">  header → h1 Campus Workshops</text><text x="35" y="203" font-family="Menlo,Consolas,monospace" font-size="20" fill="#164b63" xml:space="preserve">  main</text><text x="35" y="237" font-family="Menlo,Consolas,monospace" font-size="20" fill="#164b63" xml:space="preserve">    h2 Choose a workshop</text><text x="35" y="271" font-family="Menlo,Consolas,monospace" font-size="20" fill="#164b63" xml:space="preserve">    table</text><text x="35" y="305" font-family="Menlo,Consolas,monospace" font-size="20" fill="#164b63" xml:space="preserve">      thead → tr → two th[scope=&quot;col&quot;]</text><text x="35" y="339" font-family="Menlo,Consolas,monospace" font-size="20" fill="#164b63" xml:space="preserve">      tbody → three workshop rows</text><text x="35" y="373" font-family="Menlo,Consolas,monospace" font-size="20" fill="#164b63" xml:space="preserve">    h2 Workshop sign-up</text><text x="35" y="407" font-family="Menlo,Consolas,monospace" font-size="20" fill="#164b63" xml:space="preserve">    form[method=&quot;post&quot;]</text><text x="35" y="441" font-family="Menlo,Consolas,monospace" font-size="20" fill="#164b63" xml:space="preserve">      fieldset → legend Your information</text><text x="35" y="475" font-family="Menlo,Consolas,monospace" font-size="20" fill="#164b63" xml:space="preserve">        p → label[for=&quot;name&quot;] + input#name</text><text x="35" y="509" font-family="Menlo,Consolas,monospace" font-size="20" fill="#164b63" xml:space="preserve">        p → label[for=&quot;email&quot;] + input#email</text><text x="35" y="543" font-family="Menlo,Consolas,monospace" font-size="20" fill="#164b63" xml:space="preserve">      fieldset → legend Workshop choice</text><text x="35" y="577" font-family="Menlo,Consolas,monospace" font-size="20" fill="#164b63" xml:space="preserve">        p → label[for=&quot;workshop&quot;] + select#workshop</text><text x="35" y="611" font-family="Menlo,Consolas,monospace" font-size="20" fill="#164b63" xml:space="preserve">        p → format prompt</text><text x="35" y="645" font-family="Menlo,Consolas,monospace" font-size="20" fill="#164b63" xml:space="preserve">        p → input#in-person + label + input#online + label</text><text x="35" y="679" font-family="Menlo,Consolas,monospace" font-size="20" fill="#164b63" xml:space="preserve">      p → label[for=&quot;comments&quot;] + textarea#comments</text><text x="35" y="713" font-family="Menlo,Consolas,monospace" font-size="20" fill="#164b63" xml:space="preserve">      p → input#updates + label</text><text x="35" y="747" font-family="Menlo,Consolas,monospace" font-size="20" fill="#a34b00" xml:space="preserve">      p → button[type=&quot;button&quot;] calls showReminder()</text><text x="35" y="781" font-family="Menlo,Consolas,monospace" font-size="20" fill="#a34b00" xml:space="preserve">      p#feedback → message output</text><text x="35" y="815" font-family="Menlo,Consolas,monospace" font-size="20" fill="#164b63" xml:space="preserve">      button[type=&quot;submit&quot;] → native form submission</text><text x="35" y="849" font-family="Menlo,Consolas,monospace" font-size="20" fill="#a34b00" xml:space="preserve">  script → js/workshops.js</text><text x="35" y="958" font-family="Arial" font-size="18" fill="#405967">Button click → showReminder() → feedback.textContent.</text></svg>